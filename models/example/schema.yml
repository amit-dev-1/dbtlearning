
version: 2

sources:
  - name: demo_data
    database: demo_db
    schema: public
    tables:
      - name: orders
        columns:
          - name: ord_id
            tests:
              - unique:
                  severity: Warn
                  store_failures: True
              - not_null:
                  severity: warn
                  store_failures: True
          - name: ORD_DATE
            tests:
              - not_future_date
          - name: ord_amt
            tests:
              - ord_amt_lmt:
                  severity: warn
          - name: cust_id
            tests:
              - relationships:
                  to: source('demo_data','customer')
                  field: cust_id
                  store_failures: true
                  severity: Warn
                  
      - name: customer
        columns:
          - name: cust_id
            tests:
              - not_null
              - unique
              - accepted_values:
                  values: [10,11,12,13,14,15,16]
          - name: cust_email
            tests:
              - valid_email_id

  - name: Employee_Data
    database: DBTPRACTICE_DEV
    schema: raw
    tables:
      - name: Employee
  - name: Ecommerce
    database: raw_data
    schema: ECOMMERCE
    tables:
      - name: RAW_CUSTOMERS
      - name: RAW_ORDERS

  - name: Ecommerce dbs
    database: ECOMMERCE_DBS
    schema: LANDING
    tables:
      - name: CUST_RAW
      - name: ORDER_RAW
  - name: DBT PRACTICE
    database: dbtpractice_dev
    schema: raw
    tables:
      - name: Employee
      - name: Product_Australia
      - name: Product_canada
      - name: Product_china
      - name: Product_India
      - name: Product_singapore
      - name: SRC_EMPLOYEE_DETAILS
  - name: Sales_data
    database: sales_db
    schema: raw
    tables:
      - name: RAW_CUSTOMERS
      - name: raw_orders
  
  - name: Customer_data
    database: Snapshot_db
    schema: raw
    tables:
      - name: Customer

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
  - name: ord_cust_stg
    description: "This model contains customer and thier orders info.."
    columns:
      - name: cust_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: [10,11,12,13,14]
          - relationships:
              to: source("demo_data","customer")
              field: cust_id
              